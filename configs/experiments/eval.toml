# Locked evaluation and statistics (Task 9, Requirement 25)
[experiment]
name = "eval"
split = "eval"
n_seeds = 20
scenarios = ["stable", "high_churn", "heldout_medium"]
policies = [
    "never_replace",
    "always_replace",
    "uniform_random",
    "matched_random",
    "kademlia_epoch",
    "kademlia_std",
    "heuristic",
    "tuned_heuristic",             # global tuning selection
    "tuned_heuristic_privileged",  # per-scenario selection (global where none exists)
    "oracle_heuristic",            # reference only
    "learned",                     # expands to rl_run0..rl_run{R-1}
]

[experiment.stats]
bootstrap_resamples = 10000
ci_level = 0.95
